  <style>
    :root {
      --void: #0A0A0C;
      --surface: #121215;
      --cream: #E5E0D8;
      --cream-dim: rgba(229, 224, 216, 0.5);
      --fog: #8A8580;
      --gold: #C9A96E;
      --gold-dim: rgba(201, 169, 110, 0.15);
      --ease-luxury: cubic-bezier(0.22, 0.61, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection { background: rgba(229,224,216,0.15); color: var(--cream); }

    /* Lenis requirement — MUST have for smooth scroll to work */
    html.lenis, html.lenis body {
      height: auto;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--void);
      color: var(--cream);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Film grain — ultra subtle */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: overlay;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--void); }
    ::-webkit-scrollbar-thumb { background: rgba(229,224,216,0.1); border-radius: 2px; }

    a:focus-visible {
      outline: 1px solid var(--cream-dim);
      outline-offset: 4px;
    }

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;6
      transition: all 0.4s var(--ease-luxury);
    }

    .nav.scrolled {
      padding: 1.25rem 3rem;
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(20px) saturate(1.2);
    }

    .nav-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--cream);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.15em;
